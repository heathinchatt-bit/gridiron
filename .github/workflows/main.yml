name: Send Gridiron Results

on:
  schedule:
    # Two UTC cron times so we can check America/New_York local time and respect DST
    - cron: '0 12 * * 1'  # 12:00 UTC (8:00 AM EDT when DST is in effect)
    - cron: '0 13 * * 1'  # 13:00 UTC (8:00 AM EST when standard time is in effect)
  workflow_dispatch:
    inputs:
      test_recipient:
        description: 'Email address to send the full formatted test email to (optional).'
        required: false
        default: ''
      dry_run:
        description: 'If "true" the script will only print the payload; set to "false" to actually send.'
        required: false
        default: 'true'

jobs:
  send_results:
    name: Run send-results.js at 08:00 America/New_York (or manual)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify New York local time is Monday 08:00 (skip for manual run)
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            NY_HOUR=$(TZ="America/New_York" date +'%H')
            NY_DOW=$(TZ="America/New_York" date +'%u') # 1..7 (Mon..Sun)
            echo "New York local time: hour=$NY_HOUR day_of_week=$NY_DOW"
            # Proceed only if it's Monday (1) and 08 hour
            if [ "$NY_DOW" -ne 1 ] || [ "$NY_HOUR" -ne 8 ]; then
              echo "Not target New York time; exiting without running script."
              exit 0
            fi
          else
            echo "Manual run (workflow_dispatch) — skipping scheduled time check."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            npm install firebase-admin --no-save
          fi

      - name: Run script (builds full formatted payload; respects TEST_RECIPIENT & DRY_RUN)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TEST_RECIPIENT: ${{ github.event.inputs.test_recipient }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: node scripts/send-results.js
